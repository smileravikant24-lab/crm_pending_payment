<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Pending payments · Satija Paper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12211b; --ink2:#53625a; --ink3:#8a968f;
  --brand:#17703f; --brand-deep:#0d4527; --brand-tint:#e7f0e9;
  --paper:#f6f5f0; --card:#fff; --rule:#ded9cd;
  --red:#a8321e; --red-tint:#f8e9e6;
  --amber:#a3660f; --amber-tint:#faf0e0;
  --blue:#2a5c7a; --violet:#5b4a86;
  --w:1240px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:400 15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3{font-family:Archivo,"IBM Plex Sans",system-ui,sans-serif;font-weight:600;margin:0;letter-spacing:-.01em}
button,select,input{font:inherit;color:inherit}
a{color:var(--brand-deep)}
.wrap{max-width:var(--w);margin:0 auto;padding:0 20px}

/* ---------- masthead ---------- */
.masthead{background:var(--brand-deep);color:#eef3ef;border-bottom:3px solid var(--brand)}
.masthead .wrap{display:flex;align-items:center;gap:16px;min-height:66px;flex-wrap:wrap}
.logo{height:36px;width:auto;background:#fff;border-radius:3px;padding:3px 6px}
.mast-title{font-family:Archivo;font-weight:600;font-size:17px;line-height:1.2}
.mast-sub{font-size:12.5px;color:#a9c4b4}
.mast-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{
  background:transparent;border:1px solid #4a7a60;color:#eef3ef;border-radius:4px;
  padding:7px 13px;font-size:13.5px;cursor:pointer;transition:background .12s
}
.btn:hover{background:#17703f}
.btn:focus-visible{outline:2px solid #9fd6b4;outline-offset:2px}
.btn-solid{background:var(--brand);border-color:var(--brand)}

/* ---------- headline figure ---------- */
.hero{padding:30px 0 24px;border-bottom:1px solid var(--rule)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:end}
.hero-label{font-size:13.5px;color:var(--ink2);margin-bottom:2px}
.hero-figure{font-family:Archivo;font-weight:700;font-size:clamp(40px,7vw,66px);line-height:1;letter-spacing:-.03em}
.hero-note{font-size:13.5px;color:var(--ink2);margin-top:10px;max-width:56ch}
.hero-note b{font-weight:600;color:var(--ink)}

.splitbar{display:flex;height:34px;border-radius:3px;overflow:hidden;border:1px solid var(--rule)}
.splitbar span{display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:500;min-width:0;overflow:hidden;white-space:nowrap}
.seg-FMS{background:var(--brand)}
.seg-Split{background:var(--blue)}
.seg-Manually{background:var(--violet)}
.splitkey{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13px}
.splitkey div{display:flex;gap:7px;align-items:baseline}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block;transform:translateY(-1px)}
.splitkey b{font-weight:600}
.splitkey span.mut{color:var(--ink2)}

/* ---------- week strip ---------- */
.week{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--rule);background:var(--card);padding:0}
.week div{flex:1 1 150px;padding:8px 18px;border-right:1px solid var(--rule);
  display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.week div:last-child{border-right:0}
.week .k{font-size:12px;color:var(--ink2);line-height:1.35}
.week .v{font-family:Archivo;font-weight:600;font-size:16.5px;white-space:nowrap}
.v.warn{color:var(--red)}

/* ---------- controls ---------- */
.controls{
  position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--rule);
  padding:12px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center
}
.controls input[type=search],.controls select{
  background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:8px 10px;font-size:14px
}
.controls input[type=search]{flex:1 1 230px;min-width:0}
.controls .spacer{flex:1 1 auto}
.count{font-size:13.5px;color:var(--ink2)}
.ghost{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:8px 12px;font-size:13.5px;cursor:pointer}
.ghost:hover{border-color:var(--ink3)}
.ghost[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- ledger entries ---------- */
.ledger{display:grid;gap:10px;padding:18px 0 40px}
.group-head{
  display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  padding:11px 14px;background:var(--ink);color:#fff;border-radius:3px;margin-top:10px
}
.group-head h3{font-size:14.5px;color:#fff}
.group-head .g-amt{font-family:Archivo;font-weight:600}
.group-head .g-n{font-size:12.5px;color:#b9c4bd;margin-left:8px;font-family:"IBM Plex Sans"}

.entry{
  background:var(--card);border:1px solid var(--rule);border-radius:3px;
  border-left:4px solid var(--brand);padding:14px 16px;
  display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1fr) minmax(0,1.1fr);
  gap:14px 22px;align-items:start
}
.entry.src-Split{border-left-color:var(--blue)}
.entry.src-Manually{border-left-color:var(--violet)}
.entry.late{background:#fffcfb}
.who .nm{font-family:Archivo;font-weight:600;font-size:15.5px;line-height:1.25}
.who .meta{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.55}
.who .meta i{font-style:normal;color:var(--ink3)}
.tag{
  display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:2px;
  background:var(--brand-tint);color:var(--brand-deep);margin-right:6px;vertical-align:1px
}
.tag.t-Split{background:#e3edf3;color:#1d4359}
.tag.t-Manually{background:#eceaf4;color:#413466}

.money{display:grid;gap:3px;align-content:start}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:14px;font-size:13px;
  color:var(--ink2);border-bottom:1px dotted var(--rule);padding-bottom:3px}
.mrow b{font-weight:600;color:var(--ink)}
.mrow.got b{color:var(--brand)}
.mrow.bal{border-bottom:0;padding-top:3px}
.mrow.bal span{font-weight:600;color:var(--ink)}
.mrow.bal b{font-family:Archivo;font-size:19px;font-weight:700;line-height:1.15}
.mrow.bal b.late{color:var(--red)}
.mrow.miss b{color:var(--amber);font-weight:600}

.state .pill{
  display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:2px;
  background:#eceae2;color:var(--ink2)
}
.state .pill.hot{background:var(--red-tint);color:var(--red)}
.state .pill.warm{background:var(--amber-tint);color:var(--amber)}
.state .step{font-size:12.5px;color:var(--ink2);margin-top:5px;line-height:1.5}

.trail{grid-column:1/-1;border-top:1px dashed var(--rule);padding-top:11px;display:grid;gap:7px}
.note{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;font-size:13.5px;align-items:baseline}
.note .st{font-size:11px;font-weight:600;color:var(--ink3);padding-top:2px}
.note .tx{color:var(--ink);word-break:break-word}
.note .dt{color:var(--ink3);font-size:12px;margin-left:6px;white-space:nowrap}
.note mark{background:#fbeecb;color:#6f4405;padding:0 4px;border-radius:2px;font-weight:600}
.trail .none{font-size:13px;color:var(--ink3);font-style:italic}

/* ---------- gate / states ---------- */
.state-msg{padding:60px 0;text-align:center;color:var(--ink2)}
.state-msg h2{font-size:19px;margin-bottom:8px;color:var(--ink)}
.gate{max-width:430px;margin:70px auto;background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:28px 30px}
.gate h2{font-size:19px;margin-bottom:6px}
.gate p{font-size:14px;color:var(--ink2);line-height:1.6;margin:0}
.gate input{width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:3px;font-size:15px;margin:16px 0 12px}
.gate button{background:var(--brand);color:#fff;border:0;border-radius:3px;padding:11px 20px;font-size:14.5px;cursor:pointer;width:100%}
.gate button:hover{background:var(--brand-deep)}
.gate code{background:var(--paper);padding:2px 5px;border-radius:2px;font-size:13px}
.err{background:var(--red-tint);border:1px solid #e6bfb7;color:var(--red);padding:11px 13px;border-radius:3px;font-size:13.5px;margin:14px 0}

footer{border-top:1px solid var(--rule);padding:20px 0 34px;font-size:12.5px;color:var(--ink2)}
footer p{margin:0 0 5px;max-width:78ch}
footer button{background:none;border:0;padding:0;color:var(--brand-deep);text-decoration:underline;cursor:pointer;font-size:12.5px}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .hero-grid{grid-template-columns:1fr;gap:22px}
  .entry{grid-template-columns:1fr;gap:10px}
  .controls{position:static}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- print: the weekly sheet for the owner ---------- */
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:10.5pt}
  .masthead{background:#fff;color:var(--ink);border-bottom:2px solid var(--brand)}
  .mast-sub{color:var(--ink2)}
  .mast-actions,.controls,footer button{display:none!important}
  .entry,.group-head,.week{break-inside:avoid;page-break-inside:avoid}
  .week,.entry{border-color:#ccc}
  footer{border-color:#ccc}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <img class="logo" src="https://lh3.googleusercontent.com/d/1yncNH52_uB8UKEaz6ut1eoqqMwN0gnEl" alt="Satija Paper" onerror="this.style.display='none'">
    <div>
      <div class="mast-title">Pending payments</div>
      <div class="mast-sub" id="stamp">Locked</div>
    </div>
    <div class="mast-actions" id="actions" hidden>
      <button class="btn" id="btnCsv">Download CSV</button>
      <button class="btn" id="btnPrint">Print report</button>
      <button class="btn btn-solid" id="btnRefresh">Refresh</button>
    </div>
  </div>
</header>

<main id="app"></main>

<script>
/* ================================================================
   SETUP — fill this in once and the dashboard never asks again.
   Paste the Apps Script Web App URL that ends with /exec.
   ================================================================ */
const API_URL = "";

/* The passcode is NOT stored in this file. It is typed once per browser
   and kept locally, then turned into a daily token before every request. */

const app     = document.getElementById('app');
const stamp   = document.getElementById('stamp');
const actions = document.getElementById('actions');
const STORE   = 'satija_pp_key';

let DATA = null, PASS = '';
const state = { q:'', src:'', person:'', bucket:'', sort:'out', group:false };

const BUCKETS = [
  {id:'notdue', label:'Not due yet',   test:d => d !== null && d < 0},
  {id:'d15',    label:'1 to 15 days',  test:d => d !== null && d >= 0 && d <= 15},
  {id:'d30',    label:'16 to 30 days', test:d => d !== null && d > 15 && d <= 30},
  {id:'d60',    label:'31 to 60 days', test:d => d !== null && d > 30 && d <= 60},
  {id:'d60p',   label:'Over 60 days',  test:d => d !== null && d > 60}
];

/* ---------------- formatting ---------------- */
const inr     = n => '₹' + Math.round(n || 0).toLocaleString('en-IN');
const compact = n => {
  n = n || 0;
  if (n >= 1e7) return '₹' + (n / 1e7).toFixed(2) + ' Cr';
  if (n >= 1e5) return '₹' + (n / 1e5).toFixed(2) + ' L';
  return inr(n);
};
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const bucketOf = d => (BUCKETS.find(b => b.test(d)) || {}).id || 'unknown';
const sum = (arr, f) => arr.reduce((t, x) => t + (f(x) || 0), 0);

/* Pooja often writes the figure inside the remark — "6 LAK KIYE HAI",
   "223020 RED", "3,23,697.60 BAKI HAI". Pull those out so the owner sees them. */
const MONEY_RE = new RegExp(
  '(₹\\s?[\\d,]+(?:\\.\\d+)?' +
  '|\\b\\d+(?:\\.\\d+)?\\s*(?:LAKHS|LAKH|LAKS|LAK|LACS|LAC|CRORES|CRORE|CR|K)\\b' +
  '|\\b\\d{1,3}(?:,\\d{2,3})+(?:\\.\\d+)?\\b' +
  '|\\b\\d{4,}(?:\\.\\d+)?\\b)', 'gi');

const markMoney = s => esc(s).replace(MONEY_RE, '<mark>$1</mark>');
const hasMoney  = s => { MONEY_RE.lastIndex = 0; return MONEY_RE.test(String(s || '')); };

/* ---------------- access ---------------- */
async function dailyToken(pass) {
  const day = new Date().toISOString().slice(0, 10);          // UTC date
  const buf = new TextEncoder().encode(pass + '|' + day);
  const dig = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(dig)].map(b => b.toString(16).padStart(2, '0')).join('');
}

function remember(pass) { try { localStorage.setItem(STORE, pass); } catch (e) {} }
function recall()       { try { return localStorage.getItem(STORE) || ''; } catch (e) { return ''; } }
function forget()       { try { localStorage.removeItem(STORE); } catch (e) {} }

function start() {
  if (!API_URL) return renderNoUrl();
  if (!window.crypto || !crypto.subtle)
    return renderGate('This page needs to run over https. Open the GitHub Pages link, not the file on disk.');
  PASS = recall();
  if (!PASS) return renderGate('');
  load();
}

/* ---------------- data loading ---------------- */
async function load() {
  stamp.textContent = 'Loading…';
  app.innerHTML = '<div class="state-msg wrap"><h2>Loading collections data…</h2>' +
                  '<p>Reading the FMS, Split and Manually tabs.</p></div>';
  let token;
  try { token = await dailyToken(PASS); }
  catch (e) { return renderGate('Could not build the access token in this browser.'); }

  const url = API_URL + (API_URL.includes('?') ? '&' : '?') + 'token=' + token + '&v=' + Date.now();
  fetch(url).then(r => r.json()).then(handle).catch(() => jsonp(url));
}

function jsonp(url) {
  const cb = '__satija_' + Date.now();
  window[cb] = d => { delete window[cb]; s.remove(); handle(d); };
  const s = document.createElement('script');
  s.src = url + '&callback=' + cb;
  s.onerror = () => renderError('Could not reach the Apps Script web app. Check that the deployment access is set to "Anyone".');
  document.body.appendChild(s);
}

function handle(d) {
  if (d && d.code === 'AUTH') { forget(); PASS = ''; return renderGate('That passcode did not work.'); }
  if (!d || !d.ok) return renderError((d && d.error) || 'The web app returned an unexpected response.');
  remember(PASS);
  DATA = d;
  actions.hidden = false;
  stamp.textContent = 'Updated ' + d.generatedAt + ' · ' + d.rows.length +
                      ' open items of ' + d.totalRecords + ' records';
  render();
}

/* ---------------- filtering ---------------- */
function visible() {
  const q = state.q.trim().toLowerCase();
  return DATA.rows.filter(r => {
    if (state.src && r.src !== state.src) return false;
    if (state.person && r.person !== state.person) return false;
    if (state.bucket && bucketOf(r.ageDays) !== state.bucket) return false;
    if (q) {
      const hay = [r.party, r.contact, r.phone, r.invoice, r.key, r.person, r.place,
                   r.stageLabel, r.paymentStatus].join(' ').toLowerCase() +
                  ' ' + r.remarks.map(x => x.text).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort(cmp);
}

function cmp(a, b) {
  if (state.sort === 'age')   return (b.ageDays ?? -9999) - (a.ageDays ?? -9999);
  if (state.sort === 'party') return a.party.localeCompare(b.party);
  return b.outstanding - a.outstanding;
}

/* ---------------- render ---------------- */
function render() {
  const rows = visible();
  app.innerHTML =
    hero() + weekStrip() +
    '<div class="wrap">' + controls(rows) + '</div>' +
    '<div class="wrap"><div class="ledger">' + ledger(rows) + '</div></div>' +
    footerHtml();
  wire();
}

function hero() {
  const all = DATA.rows;
  const total = sum(all, r => r.outstanding);
  const bySrc = {};
  all.forEach(r => { bySrc[r.src] = bySrc[r.src] || { label:r.srcLabel, amt:0, n:0 };
                     bySrc[r.src].amt += r.outstanding; bySrc[r.src].n++; });
  const order = ['FMS','Split','Manually'].filter(k => bySrc[k]);
  const segs = order.map(k => {
    const pc = total ? bySrc[k].amt / total * 100 : 0;
    return `<span class="seg-${k}" style="flex:0 0 ${pc.toFixed(2)}%">${pc > 9 ? compact(bySrc[k].amt) : ''}</span>`;
  }).join('');
  const key = order.map(k =>
    `<div><span class="dot seg-${k}"></span><b>${esc(bySrc[k].label)}</b>
     <span class="mut">${compact(bySrc[k].amt)} · ${bySrc[k].n} items</span></div>`).join('');

  const parties = new Set(all.map(r => r.party.trim().toUpperCase())).size;
  const over30  = all.filter(r => r.ageDays !== null && r.ageDays > 30);
  const noAmt   = all.filter(r => !r.amount);

  return `<section class="hero"><div class="wrap"><div class="hero-grid">
    <div>
      <div class="hero-label">Money still to come in, across all three trackers</div>
      <div class="hero-figure">${compact(total)}</div>
      <p class="hero-note">
        <b>${all.length}</b> open items across <b>${parties}</b> parties.
        <b>${compact(sum(over30, r => r.outstanding))}</b> of it is more than 30 days past due.
        ${noAmt.length ? `<b>${noAmt.length}</b> item${noAmt.length > 1 ? 's have' : ' has'} no invoice value filled in the sheet, so the real figure is higher.` : ''}
      </p>
    </div>
    <div>
      <div class="splitbar">${segs}</div>
      <div class="splitkey">${key}</div>
    </div>
  </div></div></section>`;
}

function weekStrip() {
  const all = DATA.rows;
  const overdueSteps = all.filter(r => r.stageOverdue !== null && r.stageOverdue > 0).length;
  const noNotes = all.filter(r => !r.remarks.length).length;
  return `<section class="week"><div class="wrap" style="display:flex;flex-wrap:wrap;padding:0">
    <div><div class="k">Collected in the last 7 days</div><div class="v">${compact(DATA.collectedThisWeek)}</div></div>
    <div><div class="k">Invoices closed this week</div><div class="v">${DATA.closedThisWeek}</div></div>
    <div><div class="k">Follow-up calls past their date</div><div class="v ${overdueSteps ? 'warn' : ''}">${overdueSteps}</div></div>
    <div><div class="k">Open items with no remark yet</div><div class="v ${noNotes ? 'warn' : ''}">${noNotes}</div></div>
  </div></section>`;
}

function controls(rows) {
  const people = [...new Set(DATA.rows.map(r => r.person).filter(Boolean))].sort();
  const opt = (v, l, cur) => `<option value="${esc(v)}"${cur === v ? ' selected' : ''}>${esc(l)}</option>`;
  return `<div class="controls">
    <input type="search" id="q" placeholder="Search party, invoice, phone or remark text" value="${esc(state.q)}">
    <select id="src">${opt('', 'All three trackers', state.src)}
      ${opt('FMS', 'Order to Delivery', state.src)}${opt('Split', 'Direct Dispatch', state.src)}${opt('Manually', 'Manual Entry', state.src)}</select>
    <select id="person">${opt('', 'Every sales person', state.person)}${people.map(p => opt(p, p, state.person)).join('')}</select>
    <select id="bucket">${opt('', 'Any age', state.bucket)}${BUCKETS.map(b => opt(b.id, b.label, state.bucket)).join('')}</select>
    <select id="sort">${opt('out', 'Biggest amount first', state.sort)}${opt('age', 'Oldest first', state.sort)}${opt('party', 'Party A to Z', state.sort)}</select>
    <button class="ghost" id="grp" aria-pressed="${state.group}">Group by party</button>
    <span class="spacer"></span>
    <span class="count">${rows.length} shown · ${compact(sum(rows, r => r.outstanding))}</span>
  </div>`;
}

function ledger(rows) {
  if (!rows.length) return `<div class="state-msg"><h2>Nothing matches these filters</h2>
    <p>Clear the search box or set the age filter back to "Any age".</p></div>`;
  if (!state.group) return rows.map(entry).join('');

  const groups = {};
  rows.forEach(r => { const k = r.party.trim().toUpperCase(); (groups[k] = groups[k] || []).push(r); });
  return Object.entries(groups)
    .sort((a, b) => sum(b[1], r => r.outstanding) - sum(a[1], r => r.outstanding))
    .map(([k, list]) => `<div class="group-head"><h3>${esc(k)}<span class="g-n">${list.length} item${list.length === 1 ? '' : 's'}</span></h3>
      <span class="g-amt">${compact(sum(list, r => r.outstanding))}</span></div>` +
      list.map(entry).join('')).join('');
}

function entry(r) {
  const late = r.ageDays !== null && r.ageDays > 30;
  const ageTxt = r.ageDays === null ? 'No due date in sheet'
    : r.ageDays < 0 ? Math.abs(r.ageDays) + ' days left to pay'
    : r.ageDays + ' days past due';
  const pillCls = r.ageDays === null ? '' : r.ageDays > 30 ? 'hot' : r.ageDays > 0 ? 'warm' : '';

  const meta = [r.contact, r.phone ? `<i>${esc(r.phone)}</i>` : '', r.place, r.person]
    .filter(Boolean).join(' · ');
  const ref = [
    r.invoice ? 'Invoice ' + esc(r.invoice) : esc(r.key),
    r.invoiceDate ? 'dated ' + esc(r.invoiceDate) : '',
    r.dueDate ? 'due ' + esc(r.dueDate) : '',
    r.terms ? esc(r.terms) : ''
  ].filter(Boolean).join(' · ');

  const notes = r.remarks.length
    ? r.remarks.map(n => `<div class="note"><span class="st">${esc(n.stage)}</span>
        <span class="tx">${markMoney(n.text)}${n.date ? `<span class="dt">${esc(n.date)}</span>` : ''}</span></div>`).join('')
    : '<div class="none">No follow-up remark has been written for this one yet.</div>';

  /* A figure typed into a remark, with nothing recorded in Amount Received, is worth flagging. */
  const spoken = r.remarks.some(n => hasMoney(n.text)) && !r.received;

  const money = r.amount
    ? `<div class="mrow"><span>Invoice total</span><b>${inr(r.amount)}</b></div>
       <div class="mrow ${r.received ? 'got' : ''}"><span>Received</span><b>${r.received ? inr(r.received) : '—'}</b></div>
       <div class="mrow bal"><span>Outstanding</span><b class="${late ? 'late' : ''}">${inr(r.outstanding)}</b></div>`
    : `<div class="mrow miss"><span>Invoice total</span><b>Not filled in sheet</b></div>
       <div class="mrow ${r.received ? 'got' : ''}"><span>Received</span><b>${r.received ? inr(r.received) : '—'}</b></div>
       <div class="mrow bal"><span>Outstanding</span><b>Unknown</b></div>`;

  return `<article class="entry src-${r.src} ${late ? 'late' : ''}">
    <div class="who">
      <div class="nm"><span class="tag t-${r.src}">${esc(r.srcLabel)}</span>${esc(r.party)}</div>
      <div class="meta">${meta}</div>
      <div class="meta">${ref}</div>
    </div>
    <div class="money">${money}
      ${spoken ? '<div class="mrow miss"><span>Note</span><b>Amount mentioned in remark only</b></div>' : ''}
    </div>
    <div class="state">
      <span class="pill ${pillCls}">${esc(ageTxt)}</span>
      <div class="step">${esc(r.stageLabel)}${r.stagePlanned ? ' · planned ' + esc(r.stagePlanned) : ''}
        ${r.stageOverdue > 0 ? ' · call is ' + r.stageOverdue + ' days late' : ''}</div>
      ${r.paymentStatus ? `<div class="step">Payment noted as ${esc(r.paymentStatus)}</div>` : ''}
    </div>
    <div class="trail">${notes}</div>
  </article>`;
}

function footerHtml() {
  const skipped = Object.keys(DATA.skipped || {});
  return `<footer><div class="wrap">
    <p>Built from the FMS, Split and Manually tabs. An item counts as pending until a stage records
    a full payment, so half payments stay on the list with the balance shown.</p>
    <p>The FMS and Split tabs repeat the same invoice on several rows. Each invoice or PO number is
    counted once here, which is why the totals are lower than a plain sum of the sheet.</p>
    ${skipped.length ? `<p>Could not read: ${esc(skipped.join(', '))}.</p>` : ''}
    <p>Build 4 · money split into total, received and outstanding; figures written inside remarks are highlighted.</p>
    <p><button id="signout">Sign out of this device</button></p>
  </div></footer>`;
}

/* ---------------- interaction ---------------- */
function wire() {
  const q = document.getElementById('q');
  if (q) q.oninput = e => {
    state.q = e.target.value; const p = e.target.selectionStart; render();
    const n = document.getElementById('q'); n.focus(); n.setSelectionRange(p, p);
  };
  const bind = (id, key) => { const el = document.getElementById(id);
    if (el) el.onchange = e => { state[key] = e.target.value; render(); }; };
  bind('src','src'); bind('person','person'); bind('bucket','bucket'); bind('sort','sort');

  const g = document.getElementById('grp');
  if (g) g.onclick = () => { state.group = !state.group; render(); };

  const so = document.getElementById('signout');
  if (so) so.onclick = () => { forget(); PASS = ''; DATA = null; actions.hidden = true;
                               stamp.textContent = 'Locked'; renderGate(''); };
}

document.getElementById('btnRefresh').onclick = load;
document.getElementById('btnPrint').onclick = () => window.print();
document.getElementById('btnCsv').onclick = () => {
  if (!DATA) return;
  const head = ['Source','Party','Contact','Phone','Sales person','Invoice / key','Invoice date',
                'Due date','Invoice amount','Received','Outstanding','Days past due',
                'Current step','Payment status','All remarks'];
  const cell = v => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
  const body = visible().map(r => [r.srcLabel, r.party, r.contact, r.phone, r.person,
    r.invoice || r.key, r.invoiceDate, r.dueDate, r.amount, r.received, r.outstanding,
    r.ageDays, r.stageLabel, r.paymentStatus,
    r.remarks.map(n => n.stage + ': ' + n.text).join(' | ')].map(cell).join(','));
  const blob = new Blob(['\uFEFF' + [head.map(cell).join(','), ...body].join('\n')],
                        { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'satija-pending-payments-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
};

/* ---------------- gate screens ---------------- */
function renderGate(msg) {
  actions.hidden = true;
  stamp.textContent = 'Locked';
  app.innerHTML = `<div class="gate">
    <h2>Enter the passcode</h2>
    <p>Ask the office for it. It is saved on this device, so you only type it once.</p>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <input id="pw" type="password" autocomplete="current-password" placeholder="Passcode">
    <button id="go">Open dashboard</button>
  </div>`;
  const pw = document.getElementById('pw');
  const go = () => { const v = pw.value.trim(); if (!v) return; PASS = v; load(); };
  document.getElementById('go').onclick = go;
  pw.onkeydown = e => { if (e.key === 'Enter') go(); };
  pw.focus();
}

function renderNoUrl() {
  app.innerHTML = `<div class="gate">
    <h2>This copy is not set up yet</h2>
    <p>Open <code>index.html</code>, find <code>const API_URL = ""</code> near the top of the script,
       and paste the Apps Script web app URL that ends in <code>/exec</code>. Commit it and the
       dashboard will connect on its own from then on.</p>
  </div>`;
}

function renderError(msg) {
  stamp.textContent = 'Could not load';
  app.innerHTML = `<div class="wrap"><div class="err">${esc(msg)}</div>
    <p style="font-size:14px;color:var(--ink2)">Open the web app URL directly in a browser tab. If it asks you
    to sign in, redeploy it with <b>Execute as: Me</b> and <b>Who has access: Anyone</b>.</p></div>`;
}

start();
</script>
</body>
</html>
